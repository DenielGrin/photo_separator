<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Обложки ресторанов — было и стало</title>
<style>
:root{--paper:#f2f1e9;--ink:#24342f;--soft:#5a6961;--green:#d4ef9a;--line:#c6cec2}*{box-sizing:border-box}html,body{margin:0;background:#151c19;color:var(--ink);font-family:Arial,Helvetica,sans-serif}body{height:100dvh;overflow:hidden}#stage{height:calc(100dvh - 46px);display:flex;align-items:center;justify-content:center}.slide{background:var(--paper);width:1280px;height:720px;position:absolute;display:none;transform-origin:center;overflow:hidden}.slide.active{display:flex}.content{padding:46px 62px 44px;width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-start}.dark{background:var(--ink);color:var(--paper)}h1{font-size:100px;line-height:.98;letter-spacing:-5px;font-weight:700;margin:35px 0 15px}h2{font-size:45px;line-height:1.1;letter-spacing:-1.5px;max-width:1150px;margin:0 0 29px}h3{font-size:25px;margin:0 0 18px;line-height:1.2}p{font-size:24px;line-height:1.35;margin:0 0 17px}.eyebrow{font-size:20px;letter-spacing:.5px;color:var(--green)}.subtitle{font-size:50px;color:var(--green);margin:12px 0 25px}.cover-line{font-size:28px;max-width:760px}.cover .muted{margin-top:auto}.muted{font-size:18px;line-height:1.35;color:var(--soft);margin:16px 0 0}.dark .muted{color:#c3cec1}.lead{font-size:29px;line-height:1.3;margin:24px 0 0}.dark strong,.dark .huge,.dark .statement{color:var(--green)}a{color:inherit;text-underline-offset:4px}figure{margin:0;min-width:0;display:flex;flex-direction:column}figure>a{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#e1e3d9;min-height:0;flex:1}img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}figcaption{font-size:19px;line-height:1.25;margin-top:12px}.photos{display:grid;gap:24px}.photos.three{grid-template-columns:repeat(3,1fr);height:350px}.photos.two{grid-template-columns:1fr 1fr}.decision{height:370px!important}.before-after{display:grid;grid-template-columns:.85fr 1.7fr;gap:42px;flex:1;min-height:0}.before-after>div{display:flex;flex-direction:column;min-height:0}.before-after>div>figure{height:350px}.compact{height:365px;grid-template-rows:1fr 1fr;gap:16px}.compact figure{min-height:0}.compact figcaption{font-size:16px;margin-top:5px}.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:40px 55px}.steps li{display:flex;gap:23px}.steps li>span{color:#7b8a66;font-size:40px;font-weight:bold}.steps h3{margin:0 0 10px}.steps p{font-size:23px}.text-compare{display:grid;grid-template-columns:1fr 1.35fr;gap:70px;flex:1}.text-compare>div:nth-child(2){border-left:2px solid var(--line);padding-left:45px}.text-compare h3{font-size:29px}.text-compare p{font-size:26px;line-height:1.35;margin-bottom:24px}code{font-size:.9em}table{border-collapse:collapse;width:100%;font-size:22px}th{text-align:left;font-size:18px;font-weight:normal;color:var(--soft);padding:0 10px 18px}td{padding:19px 10px;border-top:1px solid var(--line)}td:first-child{font-weight:bold}tbody tr:first-child{background:#e3eccf}.free-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:95px}.big{font-size:96px;line-height:1;margin:4px 0 10px;font-weight:bold;letter-spacing:-5px}.big span{font-size:44px;color:var(--soft);letter-spacing:-1px}.money{font-size:85px;margin-top:27px}.availability p{font-size:22px;margin-bottom:20px}.finding{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:70px;margin-top:28px}.huge{font-size:180px;letter-spacing:-10px;line-height:1.1}.huge span{font-size:100px;letter-spacing:-5px}.finding p{font-size:27px;margin-bottom:25px}.finding strong{font-size:36px}.conclusion{margin:28px 0 0;padding:0 0 0 26px;border-left:4px solid #8fa94c}.conclusion p{font-size:25px;margin-bottom:12px}.statement{font-size:25px;font-weight:bold;margin:25px 0 0}.next{margin:7px 0 0;padding-left:34px}.next li{font-size:28px;line-height:1.3;margin-bottom:25px;padding-left:12px}.sources{display:grid;grid-template-columns:1fr 1fr;gap:55px}.sources h3{font-size:26px}.source-list{padding:0;list-style:none;margin:0}.source-list li{font-size:18px;line-height:1.27;margin-bottom:12px}.source-list a{text-decoration:none}.source-list a:hover{text-decoration:underline}.notes{display:none;position:absolute;left:0;right:0;bottom:0;padding:18px 35px;background:#fffbea;color:#24342f;font-size:18px;line-height:1.35;border-top:2px solid #aaab8d;z-index:2}.show-notes .active .notes{display:block}nav{position:fixed;bottom:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:14px;padding:0 24px;background:#151c19;color:#e7ecdf;font-size:14px;z-index:10}nav button{background:transparent;color:inherit;border:1px solid #69796c;border-radius:0;padding:5px 10px;cursor:pointer;font:inherit}nav button:focus-visible{outline:2px solid var(--green)}nav .hint{margin-left:auto;color:#bbc8b9}#progress{position:fixed;bottom:46px;left:0;height:3px;background:var(--green);z-index:9;transition:width .15s}button:disabled{opacity:.35;cursor:default}@media(max-width:600px){nav{gap:7px;padding:0 8px;font-size:12px}nav .hint{display:none}}@media print{@page{size:landscape;margin:0}html,body{background:white;height:auto;overflow:visible}#stage{height:auto;display:block}.slide{display:flex!important;position:relative;transform:none!important;width:297mm;height:210mm;break-after:page;page-break-after:always}.slide:last-child{break-after:auto}.content{padding:15mm}.slide{print-color-adjust:exact;-webkit-print-color-adjust:exact}nav,#progress,.notes{display:none!important}h2{font-size:30px}h1{font-size:80px}.photos.three{height:300px}.before-after{max-height:420px}.source-list li{font-size:16px}}
</style></head><body><main id="stage"><!-- SLIDES --></main><div id="progress"></div><nav aria-label="Навигация по слайдам"><button id="prev" aria-label="Предыдущий слайд">←</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Следующий слайд">→</button><button id="notes" aria-pressed="false">Заметки</button><button id="full">Полный экран</button><span class="hint">← → · Home / End · N заметки · F полный экран · P печать</span></nav>
<script>
const slides=[...document.querySelectorAll('.slide')];let index=0;const prev=document.getElementById('prev'),next=document.getElementById('next');
function scale(){const ratio=Math.min(innerWidth/1280,(innerHeight-46)/720);for(const slide of slides)slide.style.transform=`scale(${ratio})`;}
function show(value,update=true){index=Math.max(0,Math.min(slides.length-1,value));slides.forEach((s,i)=>{s.classList.toggle('active',i===index);s.setAttribute('aria-hidden',i===index?'false':'true');s.inert=i!==index});document.getElementById('counter').textContent=`${index+1} / ${slides.length}`;document.getElementById('progress').style.width=`${100*(index+1)/slides.length}%`;prev.disabled=index===0;next.disabled=index===slides.length-1;if(update)history.replaceState(null,'','#'+(index+1));}
function notes(){const active=document.body.classList.toggle('show-notes');document.getElementById('notes').setAttribute('aria-pressed',String(active));}
async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}}
prev.onclick=()=>show(index-1);next.onclick=()=>show(index+1);document.getElementById('notes').onclick=notes;document.getElementById('full').onclick=full;
addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if((e.key===' '||e.key==='Enter')&&e.target.closest('button,a'))return;switch(e.key){case'ArrowRight':case'PageDown':case' ':e.preventDefault();show(index+1);break;case'ArrowLeft':case'PageUp':e.preventDefault();show(index-1);break;case'Home':e.preventDefault();show(0);break;case'End':e.preventDefault();show(slides.length-1);break;case'n':case'N':case'т':notes();break;case'f':case'F':case'а':full();break;case'p':case'P':case'з':print();break}});
addEventListener('resize',scale);addEventListener('hashchange',()=>show((Number(location.hash.slice(1))||1)-1,false));addEventListener('beforeprint',()=>slides.forEach(s=>s.inert=false));addEventListener('afterprint',()=>show(index,false));scale();show((Number(location.hash.slice(1))||1)-1,false);
</script></body></html>
